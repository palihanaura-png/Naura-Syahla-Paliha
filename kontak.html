    <hr>
    <form action="#" method="post">
        <p>
            <label>Nama Lengkap:</label><br>
            <input type="text" name="nama">
        </p>
        <p>
            <label>Email:</label><br>
            <input type="email" name="email">
        </p>
        <p>
            <label>Nomor Telepon:</label><br>
            <input type="tel" name="telepon">
        </p>
        <p>
            <label>Topik Pesan:</label><br>
            <select name="topik">
                <option>Pertanyaan Umum</option>
                <option>Pemesanan Buku</option>
                <option>Keluhan</option>
                <option>Kerja Sama</option>
            </select>
        </p>
        <p>
            <label>Pesan Anda:</label><br>
            <textarea name="pesan" rows="5" cols="35"></textarea>
        </p>
        <p>Bagaimana Anda Mengetahui Kami? (Pilih satu)</p>
        <input type="radio" name="sumber" value="media_sosial">
        Media Sosial<br>
        <input type="radio" name="sumber" value="mesin_pencari">
        Mesin Pencari<br>
        <input type="radio" name="sumber" value="rekomendasi">
        Rekomendasi Teman<br><br>
        <input type="checkbox" name="setuju">
        Setujui Syarat &amp; Ketentuan<br><br>
        <input type="submit" value="Kirim Pesan">
    </form>
